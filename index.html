<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>var p=new URLSearchParams(location.search);if(p.has('neon')||(!p.has('normal')&&new Date().getDate()%2)){document.documentElement.classList.add('neon');document.documentElement.setAttribute('data-darkreader-scheme','dark')}</script>
  <style>

    html[data-darkreader-scheme="dark"] .hub {
      background: linear-gradient(180deg, #4080d0 0%, #1850a0 50%, #0840a0 100%) !important;
      color: #fff !important;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fce5cd; text-align: center; padding: 8px 24px; margin: 0; }
    .card { background: #fce5cd; max-width: 400px; margin: 0 auto; padding: 6px 20px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { color: #000; margin-bottom: 42px; font-size: 30px; }

    .btn {
      position: relative; display: block; text-decoration: none;
      padding: 14px; margin: 20px 0; border-radius: 12px;
      font-weight: bold; font-size: 20px; color: #000;
      transform: perspective(500px) rotateY(-12deg);
      box-shadow: 2px 0 0 4px rgba(0,0,0,.2), 0 6px 0 var(--dark), 0 10px 16px rgba(0,0,0,.35);
      overflow: hidden; border: none;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .btn::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%;
      background: linear-gradient(180deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,.15) 100%);
      border-radius: 8px 8px 50% 50%; pointer-events: none;
    }
    .btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,.3), transparent);
      transition: 0.5s; z-index: 1; pointer-events: none;
    }
    .btn:hover::before { left: 100%; }
    .btn:hover { transform: perspective(500px) rotateY(0deg); box-shadow: 0 0 0 4px rgba(0,0,0,.1), 0 2px 0 var(--dark), 0 4px 10px rgba(0,0,0,.25); }
    .btn:active { transform: perspective(500px) rotateY(0deg) translateY(2px); box-shadow: 0 0 0 4px rgba(0,0,0,.1), 0 0 0 var(--dark), 0 2px 6px rgba(0,0,0,.2); }

    .orange { background: linear-gradient(180deg, #ff9933 0%, #e07020 40%, #b85510 100%); --dark: #8a3e08; }
    .green { background: linear-gradient(180deg, #6abf6e 0%, #3a9e3e 40%, #288028 100%); --dark: #1c6a1c; }
    .red { background: linear-gradient(180deg, #e87070 0%, #c84040 40%, #a02020 100%); --dark: #801818; }
    .pink { background: linear-gradient(180deg, #e060a0 0%, #b03070 40%, #902060 100%); --dark: #701850; }
    .purple { background: linear-gradient(180deg, #a048a0 0%, #883088 40%, #682068 100%); --dark: #501850; }
    .hub { background: linear-gradient(180deg, #3ba8d6 0%, #1a7daa 40%, #0e5f80 100%); --dark: #0a4a60; margin-top: 60px; padding: 14px; }

    .subtext { display: block; font-size: 12px; font-weight: normal; opacity: 0.8; margin-top: 4px; }

    html.neon .orange { background: linear-gradient(180deg, #ff8833 0%, #ff6600 40%, #cc5200 100%); --dark: #993d00; }
    html.neon .green { background: linear-gradient(180deg, #00ff00 0%, #00cc00 40%, #009900 100%); --dark: #006600; }
    html.neon .red { background: linear-gradient(180deg, #ff0000 0%, #cc0000 40%, #990000 100%); --dark: #660000; }
    html.neon .pink { background: linear-gradient(180deg, #ff33dd 0%, #dd11bb 40%, #bb0099 100%); --dark: #880077; }
    html.neon .purple { background: linear-gradient(180deg, #bf00ff 0%, #9900dd 40%, #7700bb 100%); --dark: #550099; }
    html.neon .hub { background: linear-gradient(180deg, #0bcade 0%, #09a3b5 40%, #077c9c 100%); --dark: #055f7d; }
    html.neon .btn::after {
      background: linear-gradient(180deg, rgba(255,255,255,.8) 0%, rgba(255,255,255,.15) 100%) !important;
    }
    html.neon .green::after {
      background: linear-gradient(180deg, rgba(255,255,255,.9) 0%, rgba(255,255,255,.2) 100%) !important;
    }
    html.neon body { background: #4e2a05; color-scheme: dark; }
    html.neon .card { background: #4e2a05; }
    html.neon h2 { color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Pong Games</h2>
    <a href="https://sethclydesdale.github.io/browser-pong/" class="btn orange" target="_blank" rel="noopener">Browser Pong<span class="subtext">Classic Atari style</span></a>
    <a href="https://www.pacogames.com/casual/pong" class="btn green" target="_blank" rel="noopener">PacoGames Pong<span class="subtext">Multiple game modes</span></a>
    <a href="https://webgames.dev/pong/" class="btn red" target="_blank" rel="noopener">WebGames Pong<span class="subtext">Vs AI with power shots</span></a>
    <a href="https://www.primarygames.com/arcade/classic/pongclassic/" class="btn pink" target="_blank" rel="noopener">PrimaryGames Pong<span class="subtext">1 or 2 players</span></a>
    <a href="https://gamelybyte.com/games/pong" class="btn purple" target="_blank" rel="noopener">GamelyByte Pong<span class="subtext">First to 7 wins</span></a>
    <a href="https://ccttcratings.github.io/portalhub/" class="btn hub">Portal Hub of Portals</a>
  </div>
</body>
</html>
