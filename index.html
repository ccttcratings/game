<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ping Pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    canvas { background: #16213e; border: 2px solid #0f3460; border-radius: 8px; max-width: 95vw; max-height: 95vh; }
  </style>
</head>
<body>
  <canvas id="game" width="400" height="600"></canvas>
  <script>
    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;

    var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, dur) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.value = 0.3;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.stop(audioCtx.currentTime + dur);
    }

    var paddleW = 80, paddleH = 12;
    var player = { x: W/2 - paddleW/2, y: H - 30, score: 0 };
    var cpu = { x: W/2 - paddleW/2, y: 18, score: 0 };
    var ball = { x: W/2, y: H/2, r: 8, vx: 2, vy: 2.5, speed: 3 };
    var speedBoost = 0.08;

    function reset() {
      ball.x = W/2; ball.y = H/2;
      ball.speed = 3;
      var angle = (Math.random() - 0.5) * 1.2;
      ball.vx = ball.speed * Math.sin(angle);
      ball.vy = ball.speed * Math.cos(angle);
      if (ball.vy > 0) ball.vy = -ball.vy;
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      ctx.setLineDash([8, 8]);
      ctx.strokeStyle = '#0f3460';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, H/2);
      ctx.lineTo(W, H/2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#e94560';
      ctx.fillRect(player.x, player.y, paddleW, paddleH);

      ctx.fillStyle = '#0f3460';
      ctx.fillRect(cpu.x, cpu.y, paddleW, paddleH);

      ctx.fillStyle = '#eee';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0f3460';
      ctx.font = 'bold 40px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(cpu.score, W/2, H/2 - 30);

      ctx.fillStyle = '#e94560';
      ctx.fillText(player.score, W/2, H/2 + 50);
    }

    function update() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.x - ball.r <= 0 || ball.x + ball.r >= W) {
        ball.vx *= -1;
        playSound(300, 0.1);
      }

      if (ball.y + ball.r >= player.y && ball.x >= player.x && ball.x <= player.x + paddleW) {
        ball.vy = -Math.abs(ball.vy);
        ball.speed += speedBoost;
        var angle = (ball.x - (player.x + paddleW/2)) / (paddleW/2);
        ball.vx = ball.speed * angle * 0.7;
        ball.vy = -Math.sqrt(Math.max(0.5, ball.speed * ball.speed - ball.vx * ball.vx));
        playSound(440, 0.15);
      }
      if (ball.y - ball.r <= cpu.y + paddleH && ball.x >= cpu.x && ball.x <= cpu.x + paddleW) {
        ball.vy = Math.abs(ball.vy);
        ball.speed += speedBoost;
        var angle2 = (ball.x - (cpu.x + paddleW/2)) / (paddleW/2);
        ball.vx = ball.speed * angle2 * 0.7;
        ball.vy = Math.sqrt(Math.max(0.5, ball.speed * ball.speed - ball.vx * ball.vx));
        playSound(440, 0.15);
      }

      if (ball.y > H + 20) { cpu.score++; playSound(200, 0.3); reset(); }
      if (ball.y < -20) { player.score++; playSound(600, 0.3); reset(); }

      var target = ball.x - paddleW/2;
      cpu.x += (target - cpu.x) * 0.06;
      cpu.x = Math.max(0, Math.min(W - paddleW, cpu.x));
    }

    function getCanvasX(clientX) {
      var rect = canvas.getBoundingClientRect();
      return (clientX - rect.left) / rect.width * W;
    }

    canvas.addEventListener('mousemove', function(e) {
      player.x = getCanvasX(e.clientX) - paddleW/2;
      player.x = Math.max(0, Math.min(W - paddleW, player.x));
    });

    canvas.addEventListener('touchmove', function(e) {
      e.preventDefault();
      player.x = getCanvasX(e.touches[0].clientX) - paddleW/2;
      player.x = Math.max(0, Math.min(W - paddleW, player.x));
    }, { passive: false });

    canvas.addEventListener('click', function() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
    });

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    reset();
    loop();
  </script>
</body>
</html>
