<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ping Pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    canvas { background: #16213e; border: 2px solid #0f3460; border-radius: 8px; }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="500"></canvas>
  <script>
    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;

    var paddleW = 12, paddleH = 80;
    var player = { x: 20, y: H/2 - paddleH/2, score: 0 };
    var cpu = { x: W - 20 - paddleW, y: H/2 - paddleH/2, score: 0 };
    var ball = { x: W/2, y: H/2, r: 8, vx: 5, vy: 3 };

    function reset() {
      ball.x = W/2; ball.y = H/2;
      ball.vx = (Math.random() > 0.5 ? 1 : -1) * 5;
      ball.vy = (Math.random() - 0.5) * 6;
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      ctx.setLineDash([8, 8]);
      ctx.strokeStyle = '#0f3460';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(W/2, 0);
      ctx.lineTo(W/2, H);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#e94560';
      ctx.fillRect(player.x, player.y, paddleW, paddleH);

      ctx.fillStyle = '#0f3460';
      ctx.fillRect(cpu.x, cpu.y, paddleW, paddleH);

      ctx.fillStyle = '#eee';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#e94560';
      ctx.font = 'bold 40px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(player.score, W/4, 50);

      ctx.fillStyle = '#0f3460';
      ctx.fillText(cpu.score, W*3/4, 50);
    }

    function update() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y - ball.r <= 0 || ball.y + ball.r >= H) ball.vy *= -1;

      if (ball.x - ball.r <= player.x + paddleW && ball.y >= player.y && ball.y <= player.y + paddleH) {
        ball.vx *= -1;
        ball.vy += (ball.y - (player.y + paddleH/2)) * 0.1;
      }
      if (ball.x + ball.r >= cpu.x && ball.y >= cpu.y && ball.y <= cpu.y + paddleH) {
        ball.vx *= -1;
        ball.vy += (ball.y - (cpu.y + paddleH/2)) * 0.1;
      }

      if (ball.x < 0) { cpu.score++; reset(); }
      if (ball.x > W) { player.score++; reset(); }

      var target = ball.y - paddleH/2;
      cpu.y += (target - cpu.y) * 0.06;
      cpu.y = Math.max(0, Math.min(H - paddleH, cpu.y));
    }

    canvas.addEventListener('mousemove', function(e) {
      var rect = canvas.getBoundingClientRect();
      player.y = (e.clientY - rect.top) / rect.height * H - paddleH/2;
      player.y = Math.max(0, Math.min(H - paddleH, player.y));
    });

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
